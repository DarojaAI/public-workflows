# agent-guardrails.yml — required check for repos with agent-coding=true
# (DarojaAI/linux-desktop-seed#3362). TEMPLATE: the source of truth lives in
# DarojaAI/linux-desktop-seed config/agent-coding/agent-guardrails.yml. Each
# org's workflow home (config/agent-coding.json guardrails.workflow_homes;
# default ORG/.github) carries it rendered, and the org ruleset "agent-coding:
# default branch" references it there as a required workflow. A home pinned
# to a release tag (DarojaAI/public-workflows) is released by a human; the
# setup (scripts/maintenance/agent-coding-org-setup.sh) checks the tag holds
# exactly this rendering. APPROVERS is rendered from guardrails.approvers
# (the placeholder below is never committed as is).
#
# Port of DarojaAI/whippingboy claude-guardrails (infra-actions
# tool/check/claude-guardrails): G1 gate files, G2 no deleted tests or new
# skips. Self-contained on purpose: it runs in every org listed in the
# config, and a private reusable workflow in another org is not callable.
#
# Applies to agent PRs only: head branch agent/** or author
# darojaai-agents[bot]. Other PRs pass. G1 is tier 1 only: CODEOWNERS, the
# guardrails, claude-run, merge lanes (auto-merge, ready-merge), agent-coding
# setup and token minting, rulesets and branch protection, and the Semgrep gate
# and its baseline (an agent could otherwise accept its own findings). An approver overrides with the
# `gate-approved` label applied AFTER the PR's latest commit. The check never
# waits (waiting burned Actions minutes): it fails at once, writes the reason to
# the job summary and keeps one PR comment up to date ("waiting for approval",
# with the files and a link to re-run). Ruleset-required workflows don't run on
# `labeled`, so after labelling, re-run the failed check (the comment links it).
name: agent-guardrails

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write  # one status comment on the PR; nothing else is written

jobs:
  agent-guardrails:
    name: agent-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for the base...head diff)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: G1 gate files + G2 test tampering
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APPROVERS: "patelmm79"
        run: |
          set -euo pipefail
          if [[ "${HEAD_REF}" != agent/* && "${PR_AUTHOR}" != "darojaai-agents[bot]" ]]; then
            echo "agent-guardrails: not an agent PR (head ${HEAD_REF}, author ${PR_AUTHOR}); pass"
            exit 0
          fi
          git fetch --no-tags --quiet origin "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null || true
          events="$(mktemp)"
          gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/events" --jq '.[]' | jq -s . > "${events}"
          head_date="$(git log -1 --format=%cI "${HEAD_SHA}")"
          python3 - "${events}" "${head_date}" <<'PY'
          import datetime as dt, fnmatch, json, os, re, subprocess, sys, time

          # Tier 1 only: files that control the guardrails themselves (who may
          # merge, what is required, agent access). An agent editing one could
          # switch off its own checks, so a human approves. Ordinary workflows,
          # pre-commit and coverage config are not here: they are to be judged
          # by an independent automated review (tier 2), not a human label.
          GATE = ["CODEOWNERS", "**/CODEOWNERS", "**agent-guardrails*", "**claude-guardrails*",
                  "**claude-run*", "**automerge*", "**auto-merge*", "**ready-merge*",
                  "**agent-coding*", "**agent-gh*", "**ruleset*", "**branch-protection*",
                  "**branch_protection*", ".semgrep/**", "**.semgrepignore", "**semgrep_gate*",
                  "tests/canaries/**"]
          TESTS = ["tests/**", "test/**", "**/tests/**", "**/test/**", "**/__tests__/**",
                   "**test_*.py", "**_test.py", "**.test.ts", "**.test.tsx", "**.test.js",
                   "**.test.jsx", "**.spec.ts", "**.spec.tsx", "**.spec.js", "**.spec.jsx",
                   "**.bats", "**_test.go"]
          JS = ["**.js", "**.jsx", "**.ts", "**.tsx"]
          SKIPS = [
              (r"@pytest\.mark\.(skip|skipif|xfail)\b", "pytest skip/xfail marker", ["**.py"]),
              (r"\bpytest\.(skip|xfail)\(", "pytest.skip()/xfail() call", ["**.py"]),
              (r"@unittest\.(skip|skipIf|skipUnless|expectedFailure)\b", "unittest skip", ["**.py"]),
              (r"\b(it|test|describe|context)\.(skip|todo)\(", "JS .skip/.todo", JS),
              (r"\b(xit|xtest|xdescribe)\(", "JS x-prefixed test", JS),
              (r"^\s*skip(\s|$)", "bats skip", ["**.bats"]),
              (r"\bt\.Skip(f|Now)?\(", "Go t.Skip", ["**.go"]),
              (r"\|\|\s*true\b", "`|| true`", None),
          ]

          def match(p, globs):
              return any(fnmatch.fnmatchcase(p, g.replace("**", "*")) for g in globs)

          def git(*a):
              return subprocess.run(["git", *a], check=True, capture_output=True, text=True).stdout

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          rows = [l.split("\t") for l in git("diff", "--name-status", "--no-renames",
                                              f"{base}...{head}").splitlines()]
          changed = [(r[0][0], r[-1]) for r in rows if len(r) >= 2]

          approvers = {x.strip() for x in os.environ["APPROVERS"].split(",") if x.strip()}
          ts = lambda s: dt.datetime.fromisoformat(s.replace("Z", "+00:00"))
          head_ts = ts(sys.argv[2])
          MARKER = "<!-- agent-guardrails -->"

          def is_approved(events):
              labeled = [e for e in events
                         if e.get("event") == "labeled"
                         and (e.get("label") or {}).get("name") == "gate-approved"]
              last = max(labeled, key=lambda e: ts(e["created_at"])) if labeled else None
              return bool(last and (last.get("actor") or {}).get("login") in approvers
                          and ts(last["created_at"]) > head_ts)

          def gh(*args, data=None):
              return subprocess.run(["gh", "api", *args], input=data, check=True,
                                    capture_output=True, text=True, timeout=30).stdout

          def upsert_comment(body, create):
              # One comment per PR: the bot's own, found by MARKER. A failure here never
              # changes the verdict.
              try:
                  repo, pr = os.environ["REPO"], os.environ["PR_NUMBER"]
                  ids = gh("--paginate", f"repos/{repo}/issues/{pr}/comments", "--jq",
                           f'.[] | select(.user.login == "github-actions[bot]" and '
                           f'(.body | startswith("{MARKER}"))) | .id').split()
                  payload = json.dumps({"body": MARKER + "\n" + body})
                  if ids:
                      gh("-X", "PATCH", f"repos/{repo}/issues/comments/{ids[0]}", "--input", "-", data=payload)
                  elif create:
                      gh("-X", "POST", f"repos/{repo}/issues/{pr}/comments", "--input", "-", data=payload)
              except Exception as e:  # noqa: BLE001
                  print(f"agent-guardrails: couldn't update the PR comment: {str(e)[:200]}")

          def summary(text):
              try:
                  path = os.environ.get("GITHUB_STEP_SUMMARY")
                  if path:
                      with open(path, "a") as f:
                          f.write(text + "\n")
              except Exception as e:  # noqa: BLE001
                  print(f"agent-guardrails: couldn't write the job summary: {str(e)[:200]}")

          approved = is_approved(json.load(open(sys.argv[1])))

          # A gate file whose only change is moving DarojaAI reusable pins to newer
          # release tags (same repo and path, every other byte identical) isn't
          # gated: a tag can only point at code merged on that repo's guarded main.
          PIN = re.compile(r"(DarojaAI/[\w.-]+/[^@\s'\"]+)@v(\d+)\.(\d+)\.(\d+)(?![\w.-])")

          def pin_bump_only(status, path):
              if status != "M":
                  return False
              diff = git("diff", "--unified=0", "--no-renames", f"{base}...{head}", "--", path)
              if "\\ No newline" in diff:
                  return False
              body = [l for l in diff.splitlines()
                      if not l.startswith(("diff ", "index ", "--- ", "+++ ", "@@"))]
              rem = [l[1:] for l in body if l.startswith("-")]
              add = [l[1:] for l in body if l.startswith("+")]
              if not rem or len(rem) != len(add) or len(body) != len(rem) + len(add):
                  return False
              for r, a in zip(rem, add):
                  if PIN.sub(r"\1@TAG", r) != PIN.sub(r"\1@TAG", a):
                      return False
                  olds = [tuple(map(int, m[1:])) for m in PIN.findall(r)]
                  news = [tuple(map(int, m[1:])) for m in PIN.findall(a)]
                  if not olds or any(n < o for o, n in zip(olds, news)) or olds == news:
                      return False
              return True

          findings, bumps = [], []
          for s_, p in changed:
              if match(p, GATE):
                  (bumps if pin_bump_only(s_, p) else findings).append(p)
          for p in bumps:
              print(f"agent-guardrails: {p}: only DarojaAI pins moved to newer tags; not gated")
          findings = [f"G1: gate file touched: {p}" for p in findings]
          shown = list(findings)  # what the PR comment shows: never the added line's text
          for status, path in changed:
              if not match(path, TESTS):
                  continue
              if status == "D":
                  findings.append(f"G2: deleted test file: {path}")
                  shown.append(findings[-1])
                  continue
              diff = git("diff", "--unified=0", "--no-renames", f"{base}...{head}", "--", path)
              for line in (l[1:] for l in diff.splitlines()
                           if l.startswith("+") and not l.startswith("+++")):
                  for pat, label, globs in SKIPS:
                      if (globs is None or match(path, globs)) and re.search(pat, line):
                          findings.append(f"G2: {path}: added {label}: {line.strip()[:120]}")
                          shown.append(f"G2: {path}: added {label} (the line is in the job log)")
                          break
          for f in findings:
              print(f)
          who = ", ".join(f"@{a}" for a in sorted(approvers))
          if not findings:
              print("agent-guardrails: PASS (no gate files, no deleted tests, no new skips)")
              upsert_comment("**agent-guardrails: passed.** No gate files, deleted tests or new skips "
                             "at the latest commit.", create=False)
              sys.exit(0)
          # Paths are untrusted: show them in a code block whose fence is longer than any
          # backtick run in them, so they can't add mentions, links or images.
          text = "\n".join(shown[:50]) + ("\n..." if len(shown) > 50 else "")
          fence = "`" * max(3, 1 + max((len(r) for r in re.findall(r"`+", text)), default=0))
          listed = f"{fence}text\n{text}\n{fence}"
          if approved:
              print("agent-guardrails: PASS (gate-approved by an approver after the latest commit)")
              upsert_comment(f"**agent-guardrails: approved.** `gate-approved` was added after the "
                             f"latest commit for:\n{listed}", create=True)
              summary(f"### agent-guardrails: approved\n{listed}")
              sys.exit(0)
          run_url = os.environ.get("RUN_URL", "")
          body = (f"**agent-guardrails: waiting for approval from {who}.**\n\n"
                  f"This PR touches files that control the guardrails, or removes or skips tests:\n"
                  f"{listed}\n\n"
                  f"To approve: add the `gate-approved` label, then [re-run this check]({run_url}) "
                  f"(Re-run failed jobs). A new commit needs a new approval.")
          upsert_comment(body, create=True)
          summary("### agent-guardrails: waiting for approval\n" + body)
          print(f"::error title=agent-guardrails::Waiting for `gate-approved` from {who}; "
                "add the label, then re-run this check.")
          print("agent-guardrails: FAIL. Needs `gate-approved` from an approver, applied after the "
                "latest commit. Add the label, then re-run this check.")
          sys.exit(1)
          PY
